services:
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
      - node-backend

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=${BACKEND_URL}
      - NODE_BACKEND_URL=${NODE_BACKEND_URL}
    depends_on:
      - backend

  backend:
    build:
      context: backend
    environment:
      DB_HOST: postgres
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      NODE_BACKEND_URL: ${NODE_BACKEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    depends_on:
      postgres:
        condition: service_healthy

  node-backend:
    build: ./node-backend
    ports:
      - "40000-40050:40000-40050/udp"
    environment:
      PORT: 4000
      JAVA_BACKEND_URL: ${BACKEND_URL}
      AUDIT_FILE_PATH: /app/data/audit.ndjson
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      WEBRTC_PUBLIC_IP: ${WEBRTC_PUBLIC_IP:-127.0.0.1}
      WEBRTC_PORT_MIN: 40000
      WEBRTC_PORT_MAX: 40050
    volumes:
      - node_audit_data:/app/data
    depends_on:
      - backend

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  node_audit_data: