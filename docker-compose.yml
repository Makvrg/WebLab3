services:
  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend
      - node-backend

  frontend:
    build: ./frontend
    environment:
      - BACKEND_URL=${BACKEND_URL}
      - NODE_BACKEND_URL=${NODE_BACKEND_URL}
      - WEBRTC_ICE_SERVERS=${WEBRTC_ICE_SERVERS:-}
    depends_on:
      - backend

  backend:
    build:
      context: backend
    environment:
      DB_HOST: postgres
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      NODE_BACKEND_URL: ${NODE_BACKEND_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
    volumes:
      - ./secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      postgres:
        condition: service_healthy

  node-backend:
    build: ./node-backend
    ports:
      - "40000-40009:40000-40009/udp"
    environment:
      PORT: 4000
      JAVA_BACKEND_URL: ${BACKEND_URL}
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN}
      WEBRTC_PUBLIC_IP: ${WEBRTC_PUBLIC_IP}
      WEBRTC_PORT_MIN: 40000
      WEBRTC_PORT_MAX: 40009
      WEBRTC_ICE_SERVERS: ${WEBRTC_ICE_SERVERS:-}
    volumes:
      - ./secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    depends_on:
      - backend

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: