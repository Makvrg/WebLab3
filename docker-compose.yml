services:

  frontend:
    build: ./frontend
    ports:
      - "63342:80"
    depends_on:
      - backend

  backend:
    build:
      context: backend
    ports:
      - "5000:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: