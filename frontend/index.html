<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список студентов</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
</head>
<body>
    <div class="container">
        <header>
            <h1>Заявки на общежитие</h1>
            <div id="header-actions" style="display: flex; gap: 10px;">
                <a href="form.html" class="btn" id="filter-btn">Применить фильтры</a>
                <a href="form.html" class="btn btn-primary" id="add-btn">Добавить студента</a>
                <button type="button" class="btn btn-danger" id="logout-btn" hidden>Выйти</button>
            </div>
        </header>

        <div id="auth-required" class="card" style="text-align: center;" hidden>
            <h2>Требуется авторизация</h2>
            <p style="margin: 15px 0; color: var(--text-muted);">
                Для просмотра списка студентов и работы с заявками необходимо войти в систему.
            </p>
            <a href="auth.html" class="btn btn-primary">Перейти к авторизации</a>
        </div>

        <div class="table-responsive" id="main-content">
            <table id="students-table">
                <thead>
                    <tr>
                        <th>ИСУ ID</th>
                        <th>ФИО</th>
                        <th>Группа</th>
                        <th>Общежитие</th>
                        <th>Комната</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
