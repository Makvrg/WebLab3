server {
    listen 80;
    client_max_body_size 50M;

    # 1. Сигналинг WebRTC -> Node.js
    location = /api/rtc/session {
        if ($request_method !~ ^(POST|OPTIONS)$) {
            return 405;
        }
        proxy_pass http://node-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 2. Импорт и экспорт CSV -> Node.js
    location /api/rt/csv/ {
        proxy_pass http://node-backend:4000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Проверка состояния Node.js -> Node.js
    location = /api/rt/health {
        proxy_pass http://node-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 4. Весь остальной сайт и API (/api/auth, /api/students, /api/users, /api/audit) -> фронтенд
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
