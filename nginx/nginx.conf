server {
    listen 80;
    client_max_body_size 50M;

    # 1. Сигналинг WebRTC (WebSocket) -> напрямую в Node.js
    location /api/rt/signal {
        proxy_pass http://node-backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 3600s;
    }

    # 2. Журнал аудита и импорт/экспорт CSV -> напрямую в Node.js
    location /api/rt/ {
        proxy_pass http://node-backend:4000;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
    }

    # 3. Весь остальной сайт и API (/api/auth, /api/students, /api/users) -> фронтенд и его мидлвейр
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}